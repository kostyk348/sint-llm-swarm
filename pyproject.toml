[project]
name = "sint-llm-swarm"
version = "0.2.0"
description = "LLM Swarm with SINT-intrinsic roles: sense, classify, cognition, metacognition, provenance, temporal, uncertainty, feedback"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "kostyk348"}]
keywords = ["sint", "llm-swarm", "mcp", "multi-agent", "cognitive-layers"]

dependencies = ["fastmcp"]

[project.scripts]
sint-llm-swarm = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
